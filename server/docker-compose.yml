# ===================================================================
# Crystal Messenger real-time server - one-command production deploy
#
#   cd server
#   cp .env.server.example .env.server   # fill in SUPABASE_JWT_SECRET
#   docker compose up -d
#
# The offline queue persists in the named volume `crystal-data`.
# ===================================================================

services:
  crystal-server:
    build: .
    image: crystal-server:latest
    container_name: crystal-server
    restart: unless-stopped
    ports:
      - "${CRYSTAL_WS_PORT:-8081}:8081"
    env_file:
      - .env.server
    environment:
      CRYSTAL_WS_PORT: 8081
      CRYSTAL_DATA_DIR: /data
    volumes:
      - crystal-data:/data
      # Uncomment to terminate TLS in the server itself:
      # - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  crystal-data:

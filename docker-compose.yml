# ===================================================================
# Crystal Messenger - Full Stack Docker Compose
#
# Usage:
#   1. cp .env.example .env                     (fill in Supabase creds)
#   2. cp server/.env.server.example server/.env.server  (fill in JWT secret)
#   3. docker compose up -d
#
# The Erlang real-time server runs on port 8081 by default.
# The offline queue persists in the named volume `crystal-data`.
# ===================================================================

services:
  crystal-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: crystal-server:latest
    container_name: crystal-server
    restart: unless-stopped
    ports:
      - "${CRYSTAL_WS_PORT:-8081}:8081"
    env_file:
      - ./server/.env.server
    environment:
      CRYSTAL_WS_PORT: 8081
      CRYSTAL_DATA_DIR: /data
    volumes:
      - crystal-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - crystal-net

volumes:
  crystal-data:
    driver: local

networks:
  crystal-net:
    driver: bridge

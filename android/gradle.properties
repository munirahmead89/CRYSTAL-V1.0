# Sized for this build machine (7.8 GB RAM). The previous -Xmx8G caused
# Gradle/R8 to swap and stall assembleRelease with no APK output.
org.gradle.jvmargs=-Xmx2304m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
org.gradle.workers.max=4

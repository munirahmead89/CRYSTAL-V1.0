# Codemagic CI/CD for Crystal Messenger (Flutter)
# Docs: https://docs.codemagic.io/yaml/yaml/

workflows:
  android-release:
    name: Crystal Messenger - Android APK
    max_build_duration: 45
    instance_type: mac_mini_m2
    working_directory: crystal_messenger
    environment:
      flutter: stable
      java: 17
      groups:
        - supabase_credentials
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
        - $CM_BUILD_DIR/.dart_tool
    scripts:
      - name: Pub get
        script: flutter pub get

      - name: Build runners
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (release)
        script: |
          VERSION_LINE=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //')
          BUILD_NAME=$(echo "$VERSION_LINE" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VERSION_LINE" | cut -d'+' -f2)
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --build-name="$BUILD_NAME" ${BUILD_NUMBER:+--build-number="$BUILD_NUMBER"}
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

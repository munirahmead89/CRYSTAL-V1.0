# ============================================================================
# Crystal Messenger — Kong declarative config for self-hosted Supabase.
# Funnels /auth /rest /storage /realtime /functions through one origin.
# ============================================================================
_format_version: "3.0"

services:
  - name: auth-v1
    host: auth
    port: 9999
    protocol: http
    routes:
      - name: auth-v1-route
        paths:
          - /auth/v1/

  - name: rest-v1
    host: rest
    port: 3000
    protocol: http
    routes:
      - name: rest-v1-route
        paths:
          - /rest/v1/

  - name: storage-v1
    host: storage
    port: 5000
    protocol: http
    routes:
      - name: storage-v1-route
        paths:
          - /storage/v1/

  - name: functions-v1
    host: edge-runtime
    port: 8081
    protocol: http
    routes:
      - name: functions-v1-route
        paths:
          - /functions/v1/

  - name: realtime-v1
    host: realtime
    port: 4000
    protocol: http
    routes:
      - name: realtime-v1-route
        paths:
          - /realtime/v1/
    # WebSocket upgrade for Realtime channels.

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - apikey
        - X-Client-Info
        - X-Client-Device
        - X-Client-Version
      exposed_headers:
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - X-RateLimit-Reset
      max_age: 3600
      credentials: true
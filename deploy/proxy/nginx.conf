# ============================================================================
# Crystal Messenger — nginx edge load balancer.
#
# Sits in front of N Caddy replicas ($LB_UPSTREAMS, default caddy:8443).
# Terminates nothing itself (TLS is on Caddy) unless LB_TERMINATE_TLS=on.
# Enables WebSocket upgrades for Realtime traffic.
# ============================================================================

worker_processes auto;

events {
	worker_connections 4096;
}

http {
	upstream caddy_backend {
		least_conn;
		# Passive health: drop a replica after 3 failures, retry in 30s.
		# For N replicas add lines here, e.g.:
		#   server caddy-2:80 max_fails=3 fail_timeout=30s;
		include /etc/nginx/upstreams.conf;
	}

	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	server {
		listen 80 default_server;
		listen [::]:80 default_server;

		# WebSocket upgrade pass-through for Realtime.
		location /realtime/ {
			proxy_pass http://caddy_backend;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $host;
			proxy_read_timeout 3600s;
			proxy_send_timeout 3600s;
		}

		# Everything else is normal HTTP through the pool.
		location / {
			proxy_pass http://caddy_backend;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_read_timeout 60s;
		}

		# Rate limit badly-behaved clients at the edge (bursty login spam).
		limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
		limit_req zone=api burst=40 nodelay;
	}

	server {
		listen 8443 ssl;
		http2 on;

		ssl_certificate     /etc/nginx/tls/fullchain.pem;
		ssl_certificate_key /etc/nginx/tls/privkey.pem;

		location /realtime/ {
			proxy_pass http://caddy_backend;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $host;
			proxy_read_timeout 3600s;
		}

		location / {
			proxy_pass http://caddy_backend;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto https;
		}
	}
}
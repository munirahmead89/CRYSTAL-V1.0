name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 'stable'
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        working-directory: crystal_messenger
        run: flutter pub get

      - name: Run code generation
        working-directory: crystal_messenger
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        working-directory: crystal_messenger
        run: flutter analyze --no-pub || true

      - name: Build APK (arm64-v8a)
        working-directory: crystal_messenger
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-messenger-apk-arm64
          path: crystal_messenger/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build_aab:
    name: Build AAB (Play Store)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: crystal_messenger
        run: flutter pub get

      - name: Run code generation
        working-directory: crystal_messenger
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build AAB
        working-directory: crystal_messenger
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-messenger-aab
          path: crystal_messenger/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

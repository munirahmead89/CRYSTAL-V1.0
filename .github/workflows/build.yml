name: Full Stack Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.6'
  JAVA_VERSION: '17'

jobs:
  # ───────────────────────────────────────────────
  # Flutter APK build
  # ───────────────────────────────────────────────
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        working-directory: crystal_messenger
        run: flutter pub get

      - name: Run code generation
        working-directory: crystal_messenger
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        working-directory: crystal_messenger
        run: flutter analyze --no-pub || true

      - name: Build APK (arm64-v8a)
        working-directory: crystal_messenger
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-messenger-apk-arm64
          path: crystal_messenger/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ───────────────────────────────────────────────
  # Flutter AAB (Play Store) - main/master only
  # ───────────────────────────────────────────────
  build-aab:
    name: Build AAB (Play Store)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: crystal_messenger
        run: flutter pub get

      - name: Run code generation
        working-directory: crystal_messenger
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build AAB
        working-directory: crystal_messenger
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-messenger-aab
          path: crystal_messenger/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ───────────────────────────────────────────────
  # Erlang real-time server Docker image
  # ───────────────────────────────────────────────
  build-server:
    name: Build Server (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/crystal-server
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

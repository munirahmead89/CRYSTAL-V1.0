name: crystal_messenger
description: "Crystal Messenger — private messaging with calls, media transfer and offline support."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Fonts — Inter is loaded via google_fonts instead of bundled assets.
  google_fonts: ^6.2.1

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.1

  # Backend - Supabase
  supabase_flutter: ^2.5.2

  # Database - SQLite (Drift)
  drift: ^2.19.0
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.22
  path_provider: ^2.1.3
  path: ^1.9.0

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^6.1.5

  # Storage & Utilities
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^8.3.7
  permission_handler: ^11.4.0
  logger: ^2.3.0
  collection: ^1.19.1
  device_info_plus: ^11.0.0
  package_info_plus: ^8.3.1
  shared_preferences: ^2.3.0
  local_auth: ^2.1.7
  # LocalAuthException / LocalAuthExceptionCode are not re-exported by
  # local_auth, but the app lock needs them to tell 'user cancelled' apart
  # from 'this device has no screen lock'.
  local_auth_platform_interface: ^1.1.0

  # Functional Programming
  # fpdart backs the Either-based Failure/Result types in core/errors.
  fpdart: ^1.1.0

  # QR Codes
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

  # Voice Notes
  record: ^7.1.1
  just_audio: ^0.9.44

  # WebRTC audio/video transport. Signaling remains in Supabase Realtime.
  flutter_webrtc: ^1.6.2+hotfix.4

  # NOTE: the WebRTC P2P transport was removed. Every message now goes\r\n  # through Supabase as a client/server relay, which is the model this app\r\n  # is built around: one durable ordering per conversation, receipts that\r\n  # actually mean something, and media that both sides fetch from Storage.\r\n  # P2P also required a TURN server that was never configured, so on\r\n  # symmetric-NAT networks it silently fell back to the server anyway.\r\n\r\n  # Video playback
  video_player: ^2.14.0
  chewie: ^1.13.1

  # Background tasks
  workmanager: ^0.10.10

  # In-app notifications. Local only: the app renders message/transfer
  # notifications itself from Supabase Realtime, so there is no remote push
  # provider in the dependency tree.
  flutter_local_notifications: ^17.2.4
  realtime_client: ^2.13.0

  # Keeps the screen on while the app is in the foreground. Requires the
  # WAKE_LOCK permission, which is declared in AndroidManifest.xml.
  wakelock_plus: ^1.3.3

  # Integrity checks for the chunked media pipeline. `crypto` gives a pure-Dart
  # SHA-256 used to fingerprint each part and the whole file, so a reassembled
  # download can be proven byte-identical to what the sender captured.
  crypto: ^3.0.6
  share_plus: ^12.0.2

  # Imported directly by lib/. Both were only present as transitive
  # dependencies, which works right up until a parent package drops them and
  # the build fails on a machine that never had the cache warm.
  app_links: ^7.2.1
  url_launcher: ^6.3.2

  # Client-side image compression before upload. Uses the platform's own
  # encoder (Android BitmapFactory / iOS ImageIO) rather than a pure-Dart
  # codec, which matters: a 12 MP photo decoded as raw RGBA is ~48 MB of RAM,
  # and doing that on the upload path is how a phone runs out of memory mid-send.
  flutter_image_compress: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

  # Code Generation — only Drift and Pigeon use codegen; all Riverpod
  # providers are hand-written so riverpod_generator, riverpod_lint,
  # custom_lint, freezed and json_serializable are not needed.
  build_runner: ^2.4.11
  drift_dev: ^2.19.0
  pigeon: ^22.7.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Inter font is loaded via the google_fonts package at runtime.
  # No font files need to be bundled in assets/fonts/.
